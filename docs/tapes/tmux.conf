# A minimal tmux look for the README screenshot (not the user's config).
set -g default-terminal "tmux-256color"
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold] txoko #[default]"
set -g status-left-length 20
set -g status-right "#[fg=white]#(txoko status) "
set -g status-right-length 40
set -g status-interval 1
set -g window-status-format ""
set -g window-status-current-format ""
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
# A plain shell, so the screenshot never shows anyone's own prompt.
set -g default-command "bash --norc --noprofile"
